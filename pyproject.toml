[project]
name = "robust-covar"
version = "0.2.1"
description = "Does a better (robust) covariance estimate give a lower-risk portfolio out of sample?"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Arnaud van Haaster", email = "git.8gsk7@passmail.net" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.67.0",
]
data = [
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.black]
line-length = 88
