[project]
name = "robust-covar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arnaud van Haaster", email = "python-projects.w5kvc@passmail.net" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "requests[data]>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.67.0",
]
data = [
    "numpy>=2.5.4",
    "tqdm[data]>=4.70.1",
    "yfinance[data]>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.black]
line-length = 88
